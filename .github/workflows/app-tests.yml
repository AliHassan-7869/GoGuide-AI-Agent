name: App checks

# Gates the Expo app (mobile + web). The backend has its own workflow (backend-tests.yml).
on:
  push:
    branches: [main, staging]
    paths:
      - "app/GoGuide/**"
      - "firestore.rules"
      - ".github/workflows/app-tests.yml"
  pull_request:
    paths:
      - "app/GoGuide/**"
      - "firestore.rules"
      - ".github/workflows/app-tests.yml"

permissions:
  contents: read

concurrency:
  group: app-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app/GoGuide
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: app/GoGuide/package-lock.json

      # app/GoGuide/.npmrc already sets legacy-peer-deps=true (same as the Vercel build)
      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npx expo lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Unit tests (Node)
        run: npm test

      - name: Screen tests (Jest)
        run: npx jest --forceExit

      # Fails the build if any route has a compilation error (AGENTS.md rule 11).
      - name: Web export
        run: npx expo export -p web
