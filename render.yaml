services:
  - type: web
    name: goguide-ai-agent
    env: python
    buildCommand: "pip install --upgrade pip setuptools wheel && pip install -r requirements-render.txt"
    startCommand: "uvicorn app:app --host 0.0.0.0 --port ${PORT:-10000} --proxy-headers --forwarded-allow-ips='*'"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: FIREBASE_PROJECT_ID
        value: ai-travel-agent-e36a2
      - key: ALLOWED_ORIGINS
        value: "*"
